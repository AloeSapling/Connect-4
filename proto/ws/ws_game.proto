syntax = "proto3";

package ws;

import "models/tokens.proto";
import "models/user.proto";
import "shared/shared.proto";

// Request / client packets

message GameInsertToken {
  int32 column = 1;
  models.TokenTypes token_type = 2;
}

enum GameActions {
  GAME_ACTIONS_UNSPECIFIED = 0;
  GAME_ACTIONS_INSERT_TOKEN = 1;
  GAME_ACTIONS_FORFEIT = 2;
}

message GamePacket {
  GameActions action = 1;
  oneof data {
    GameInsertToken insert_token = 2;
  }
}

// Response / server packets

enum GameEndTypes {
  GAME_END_TYPES_UNSPECIFIED = 0;
  GAME_END_TYPES_STANDARD_WIN = 1;
  GAME_END_TYPES_FORFEITED = 2;
  GAME_END_TYPES_DRAW = 3;
}

message GameInit {
  shared.PlayerIDs player_id = 1;
}

message FallingToken {
  int32 from_col = 1;
  int32 from_row = 2;
  Tile tile = 3;
}

message GameMove {
  Tile tile = 1;
  shared.GameBoard board = 2;
  shared.PlayerIDs turn = 3;
  repeated ChangeTile changeTiles = 4;
  optional models.CurrentTokens current_tokens = 5;
  optional models.Decks decks = 6;
  repeated FallingToken falling_tokens = 7;
  repeated ChangeTile deleted_tiles = 8;
}

message ChangeTile {
  models.ChangeTokenActions action = 1;
  models.Tile tile = 2;
}

message GameEnd {
  GameEndTypes endType = 1;
  optional models.Tile tile = 2;
  optional models.PartialUser winner = 3;
  optional models.PartialUser loser = 4;
  shared.GameBoard board = 5;
  repeated ChangeTile changeTiles = 6;
  optional models.CurrentTokens current_tokens = 7;
  optional models.Decks decks = 8;
  repeated FallingToken falling_tokens = 9;
  repeated ChangeTile deleted_tiles = 10;
}

enum GameResponses {
  GAME_RESPONSES_UNSPECIFIED = 0;
  GAME_RESPONSES_ERROR = 1;
  GAME_RESPONSES_INIT = 2;
  GAME_RESPONSES_MOVE = 3;
  GAME_RESPONSES_END = 4;
}

message GameResponsePacket {
  GameResponses response = 1;
  oneof data {
    shared.CodedError error = 2;
    GameInit init = 3;
    GameMove move = 4;
    GameEnd end = 5;
  }
}
