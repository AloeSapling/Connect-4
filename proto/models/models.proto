syntax = "proto3";

package models;

import 'models/models.proto';
import 'shared/shared.proto';

message User {
  int32 id = 1;
  string session_id = 2;
  string username = 3;
}

message Game {
  shared.PlayerIDs turn = 1;
  shared.GameBoard board = 2;
  models.TokenQueueModes token_queue_mode = 3;
  optional models.CurrentTokens current_tokens = 4;
  optional models.Decks decks = 5;
}
