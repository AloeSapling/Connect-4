syntax = "proto3";

package models;

import 'shared/shared.proto';

message Lobby {
  string code = 1;
}

message User {
  string id = 1;
  string session_id = 2;
  string username = 3;
}

message LobbyMember {
  string id = 1;
  string user_id = 2;
  string lobby_code = 3;
  shared.PlayerTypes player_type = 4;
  shared.PlayerIDs player_id = 5;
}

message Game {
  shared.PlayerIDs turn = 1;
  shared.GameBoard board = 2;
}
